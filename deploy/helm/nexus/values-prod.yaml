global:
  environment: "production"

ingress:
  enabled: true
  hosts:
    - host: nexus.production.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            serviceName: nexus-web
            servicePort: 3000
    - host: api.nexus.production.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            serviceName: nexus-api
            servicePort: 3001

web:
  replicaCount: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

api:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

worker:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

mlService:
  replicaCount: 2
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
