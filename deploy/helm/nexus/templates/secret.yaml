apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  labels:
    app: nexus
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
  JWT_ACCESS_SECRET: {{ .Values.secrets.jwtAccessSecret | b64enc | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | b64enc | quote }}
  INTERNAL_SERVICE_KEY: {{ .Values.secrets.mlServiceInternalKey | b64enc | quote }}
