apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ml-service
  labels:
    app: nexus-ml-service
spec:
  replicas: {{ .Values.mlService.replicaCount }}
  selector:
    matchLabels:
      app: nexus-ml-service
  template:
    metadata:
      labels:
        app: nexus-ml-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ml-service
          image: "{{ .Values.mlService.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.mlService.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mlService.resources | nindent 12 }}
